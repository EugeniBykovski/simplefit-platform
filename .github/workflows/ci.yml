name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # The event name keeps pull_request runs out of the push group. For a PR that
  # is already merged, github.ref falls back to the base branch (refs/heads/main),
  # so a late PR run used to share the main group and cancel the main push run.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Git hooks are a local developer aid; CI runs the checks explicitly.
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the PR base and head commits exist locally and
          # commitlint can validate every commit in base..head. (A conditional
          # `cond && 0 || 1` always yields 1: 0 is falsy in Actions expressions.)
          fetch-depth: 0

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v6

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Commit messages follow the SF convention
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Generated API client is up to date
        # The backend repository is not checked out here, so this verifies the
        # committed client against the committed OpenAPI snapshot.
        run: pnpm api:check

      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          # Public fixture IDs (never deployed): the build renders the Google and
          # Apple controls, so the production geometry suite measures the real
          # provider row against its deterministic script stand-ins. Without
          # them the controls report "not available" and load no script.
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: 000000000000-geometryfixture.apps.googleusercontent.com
          NEXT_PUBLIC_APPLE_SERVICES_ID: com.simplefit.geometry.web
          NEXT_PUBLIC_APPLE_REDIRECT_URI: https://localhost/login

      - name: Storybook build
        # The component workshop must keep compiling with the real primitives.
        run: pnpm storybook:build

      # SF-34: canonical layout and system-state geometry at 1440 × 900,
      # measured on the static Storybook build above; SF-42: the production
      # routes on the production build (next start), at desktop and laptop sizes.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Geometry QA (Playwright)
        run: pnpm test:geometry
